# Configurações padrão do Apache Spark para a PoC Laguna On-Premises
# Referências:
# - Apache Spark 3.5.3 Configuration
# - Apache Hadoop 3.3.4 Working with Third-Party S3-Compatible Stores

spark.master                                     spark://spark-master:7077
spark.submit.deployMode                          client
spark.driver.host                                spark-driver
spark.driver.bindAddress                         0.0.0.0
spark.driver.port                                7078
spark.blockManager.port                          7079
spark.driver.memory                              512m
spark.executor.memory                            512m

# Conector S3A para armazenamento compatível com S3 (SeaweedFS)
spark.hadoop.fs.s3a.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                     http://seaweedfs:8333
spark.hadoop.fs.s3a.path.style.access            true
spark.hadoop.fs.s3a.connection.ssl.enabled       false
spark.hadoop.fs.s3a.aws.credentials.provider     org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider

# Otimizações de escrita Parquet em S3 compatível e leitura JSONL OpenAlex
spark.sql.caseSensitive                          true
spark.sql.mapKeyDedupPolicy                      LAST_WIN
spark.sql.parquet.compression.codec              snappy
spark.sql.sources.partitionOverwriteMode         dynamic
spark.hadoop.mapreduce.fileoutputcommitter.algorithm.version 2
