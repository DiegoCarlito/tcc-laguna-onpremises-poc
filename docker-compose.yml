services:
  seaweedfs:
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:3.79}
    container_name: laguna-seaweedfs
    command: >
      server
      -dir=/data
      -s3
      -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - ./volumes/seaweedfs:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    cpus: ${SEAWEEDFS_CPUS:-1.0}
    mem_limit: ${SEAWEEDFS_MEM_LIMIT:-512m}
    networks:
      - laguna-net

  bucket-init:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:-apache/spark:3.5.3-python3}
    image: laguna-spark:3.5.3-s3a
    container_name: laguna-bucket-init
    user: "0:0"
    depends_on:
      - seaweedfs
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-laguna_poc_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-laguna_poc_secret}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-raw-data}
      S3_BUCKET_CLEAN: ${S3_BUCKET_CLEAN:-clean-data}
    volumes:
      - ./scripts:/opt/laguna/scripts:ro
      - ./results:/opt/laguna/results
      - ./volumes/spark-work:/opt/laguna/spark-work
    command:
      - bash
      - -c
      - "mkdir -p /opt/laguna/results /opt/laguna/spark-work/worker-1 /opt/laguna/spark-work/worker-2 && chown -R spark:spark /opt/laguna/spark-work && chmod 1777 /opt/laguna/results && python3 /opt/laguna/scripts/init_buckets.py"
    restart: "no"
    networks:
      - laguna-net

  spark-master:
    image: laguna-spark:3.5.3-s3a
    container_name: laguna-spark-master
    depends_on:
      - bucket-init
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY:-96m}
      SPARK_DAEMON_JAVA_OPTS: ${SPARK_DAEMON_JAVA_OPTS:--XX:+UseSerialGC -XX:MaxMetaspaceSize=128m}
    cpus: ${SPARK_MASTER_CPUS:-1.0}
    mem_limit: ${SPARK_MASTER_MEM_LIMIT:-512m}
    networks:
      - laguna-net

  spark-worker-1:
    image: laguna-spark:3.5.3-s3a
    container_name: laguna-spark-worker-1
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-640m}
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY:-96m}
      SPARK_DAEMON_JAVA_OPTS: ${SPARK_DAEMON_JAVA_OPTS:--XX:+UseSerialGC -XX:MaxMetaspaceSize=128m}
      SPARK_LOCAL_DIRS: /opt/spark/work-local
    volumes:
      - ./volumes/spark-work/worker-1:/opt/spark/work-local
    cpus: ${SPARK_WORKER_CPUS:-2.0}
    mem_limit: ${SPARK_WORKER_MEM_LIMIT:-1536m}
    networks:
      - laguna-net

  spark-worker-2:
    image: laguna-spark:3.5.3-s3a
    container_name: laguna-spark-worker-2
    depends_on:
      - spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-640m}
      SPARK_DAEMON_MEMORY: ${SPARK_DAEMON_MEMORY:-96m}
      SPARK_DAEMON_JAVA_OPTS: ${SPARK_DAEMON_JAVA_OPTS:--XX:+UseSerialGC -XX:MaxMetaspaceSize=128m}
      SPARK_LOCAL_DIRS: /opt/spark/work-local
    volumes:
      - ./volumes/spark-work/worker-2:/opt/spark/work-local
    cpus: ${SPARK_WORKER_CPUS:-2.0}
    mem_limit: ${SPARK_WORKER_MEM_LIMIT:-1536m}
    networks:
      - laguna-net

  spark-driver:
    image: laguna-spark:3.5.3-s3a
    container_name: laguna-spark-driver
    hostname: spark-driver
    depends_on:
      - spark-master
      - seaweedfs
    command: ["sleep", "infinity"]
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-laguna_poc_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-laguna_poc_secret}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-raw-data}
      S3_BUCKET_CLEAN: ${S3_BUCKET_CLEAN:-clean-data}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_DRIVER_HOST: ${SPARK_DRIVER_HOST:-spark-driver}
      SPARK_DRIVER_PORT: ${SPARK_DRIVER_PORT:-7078}
      SPARK_BLOCKMANAGER_PORT: ${SPARK_BLOCKMANAGER_PORT:-7079}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-512m}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-512m}
    ports:
      - "4040:4040"
    volumes:
      - ./jobs:/opt/laguna/jobs:ro
      - ./scripts:/opt/laguna/scripts:ro
      - ./results:/opt/laguna/results
    cpus: ${SPARK_DRIVER_CPUS:-2.0}
    mem_limit: ${SPARK_DRIVER_MEM_LIMIT:-1536m}
    networks:
      - laguna-net

  spark-notebook:
    profiles: ["notebook"]
    build:
      context: .
      dockerfile: docker/notebook/Dockerfile
    image: laguna-spark-notebook:3.5.3-s3a
    container_name: laguna-spark-notebook
    hostname: spark-notebook
    depends_on:
      - spark-master
      - seaweedfs
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.token=laguna-poc
      - --ServerApp.root_dir=/opt/laguna/notebooks
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-laguna_poc_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-laguna_poc_secret}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:-raw-data}
      S3_BUCKET_CLEAN: ${S3_BUCKET_CLEAN:-clean-data}
      SPARK_MASTER_URL: ${SPARK_MASTER_URL:-spark://spark-master:7077}
      SPARK_DRIVER_HOST: spark-notebook
      SPARK_DRIVER_PORT: "7088"
      SPARK_BLOCKMANAGER_PORT: "7089"
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-512m}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-512m}
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/opt/laguna/notebooks
      - ./jobs:/opt/laguna/jobs:ro
      - ./results:/opt/laguna/results
    cpus: 1.0
    mem_limit: 1024m
    networks:
      - laguna-net

networks:
  laguna-net:
    driver: bridge
